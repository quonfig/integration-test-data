---
# OpenFeature provider test cases.
#
# These cases are tagged `sdk: openfeature` so the existing native SDK test
# generators (sdk-node, sdk-go, etc.) ignore them. They are consumed only by
# OpenFeature provider integration test suites.
#
# Format extensions vs. tests/eval/:
#
#   sdk: openfeature           -- marks cases as OF-only (native generators skip)
#   function: <of_method>      -- the OF provider method under test:
#                                   resolveObjectValue, resolveStringValue,
#                                   resolveBooleanValue, resolveNumberValue
#   of_context:                -- flat dot-notation context as the OF SDK sees it
#                                 (before the provider maps it to Quonfig's nested form)
#   provider_options:          -- provider constructor options (e.g. targetingKeyMapping)
#   expected.reason:           -- expected OF reason string (STATIC, TARGETING_MATCH,
#                                   SPLIT, DEFAULT, ERROR)
#   expected.error_code:       -- expected OF error code when reason is ERROR
#                                 (PARSE_ERROR, TYPE_MISMATCH, ...)
#   env_vars:                  -- env vars to set before evaluating (as in tests/eval/)
#
# Fixture data used:
#   my-string-list-key (existing)   -- string_list ["a","b","c"]
#   test.duration.PT90S (existing)  -- duration PT90S (90000 ms)
#   test.duration.P1DT6H2M1.5S (existing) -- duration P1DT6H2M1.5S (108121500 ms)
#   test.duration.malformed.30s (existing) -- duration with malformed value "30s"
#   of.targeting (new)              -- bool config with user.plan == "pro" rule
#   of.weighted (new)               -- string config, weighted 50/50 on user.id
#   getter.contract.int (existing)  -- int config, value 30
#   getter.contract.int.malformed (existing)    -- int config with malformed value "twelve"
#   getter.contract.double.malformed (existing) -- double config with malformed value "abc"
#   getter.contract.provided.int.malformed (existing) -- int config provided by
#                                     env var QUONFIG_ITD_GETTER_INT

sdk: openfeature
tests:

  ##############################################################################
  ## Case 1: string_list via resolveObjectValue returns JSON array
  ##
  ## Quonfig's string_list type has no OpenFeature equivalent. Providers must
  ## surface it through resolveObjectValue as a JSON array. Calling
  ## resolveStringValue on a string_list would be a type mismatch (returns
  ## default with ERROR reason), but resolveObjectValue must succeed.
  ##############################################################################
  - cases:
      - name: "string_list via resolveObjectValue returns JSON array"
        sdk: openfeature
        client: config_client
        function: resolveObjectValue
        type: STRING_LIST
        input:
          key: "my-string-list-key"
          default: []
        expected:
          value:
            - a
            - b
            - c
          reason: STATIC

  ##############################################################################
  ## Case 2: duration via resolveStringValue returns ISO 8601 string
  ##
  ## Quonfig's duration type has no OpenFeature equivalent. Providers must
  ## surface it through resolveStringValue as an ISO 8601 duration string.
  ## The native SDK returns milliseconds; the OF provider layer must convert.
  ## test.duration.PT90S stores value "PT90S" = 90000 ms. The stored string
  ## must come back unchanged (not re-normalized to PT1M30S).
  ##############################################################################
  - cases:
      - name: "duration via resolveStringValue returns ISO 8601 string"
        sdk: openfeature
        client: config_client
        function: resolveStringValue
        type: DURATION
        input:
          key: "test.duration.PT90S"
          default: "PT0S"
        expected:
          value: "PT90S"
          reason: STATIC

      - name: "multi-component duration via resolveStringValue returns stored ISO string unchanged"
        sdk: openfeature
        client: config_client
        function: resolveStringValue
        type: DURATION
        input:
          key: "test.duration.P1DT6H2M1.5S"
          default: "PT0S"
        expected:
          value: "P1DT6H2M1.5S"
          reason: STATIC

      # Malformed stored duration (qfg-2agi.7): the provider must not pass the
      # raw malformed string through; it returns the OF default with reason
      # ERROR (the Details half of the malformed-duration contract, see the
      # "Malformed durations" block in tests/eval/get.yaml).
      - name: "malformed stored duration via resolveStringValue returns default with ERROR"
        sdk: openfeature
        client: config_client
        function: resolveStringValue
        type: DURATION
        input:
          key: "test.duration.malformed.30s"
          default: "PT0S"
        expected:
          value: "PT0S"
          reason: ERROR
          error_code: PARSE_ERROR

  ##############################################################################
  ## Case 3: Missing key with OF default returns default, not error
  ##
  ## OpenFeature requires providers to return the caller-supplied default when
  ## a flag is not found (reason: DEFAULT), rather than throwing. This is the
  ## primary behavioral difference from the native SDK's onNoDefault: error mode.
  ##############################################################################
  - cases:
      - name: "missing key returns OF default with reason DEFAULT, not an error"
        sdk: openfeature
        client: config_client
        function: resolveBooleanValue
        type: BOOLEAN
        input:
          key: "of.key.that.does.not.exist"
          default: false
        expected:
          value: false
          reason: DEFAULT

  ##############################################################################
  ## Case 4: Dot-notation context routes to targeting rule
  ##
  ## OF context is a flat key-value bag. The provider splits on the first dot
  ## to reconstruct Quonfig's nested namespace model:
  ##   "user.plan" -> namespace "user", key "plan"
  ##
  ## of.targeting has rule: user.plan IS_ONE_OF ["pro"] -> true, else false.
  ## Passing { "user.plan": "pro" } in OF flat context must reach the rule.
  ##############################################################################
  - cases:
      - name: "dot-notation OF context routes to targeting rule (match)"
        sdk: openfeature
        client: config_client
        function: resolveBooleanValue
        type: BOOLEAN
        of_context:
          "user.plan": "pro"
        input:
          key: "of.targeting"
          default: false
        expected:
          value: true
          reason: TARGETING_MATCH

      - name: "dot-notation OF context routes to targeting rule (no match)"
        sdk: openfeature
        client: config_client
        function: resolveBooleanValue
        type: BOOLEAN
        of_context:
          "user.plan": "free"
        input:
          key: "of.targeting"
          default: false
        expected:
          value: false
          reason: STATIC

  ##############################################################################
  ## Case 5: targetingKey maps to configured property for weighted value bucketing
  ##
  ## OF context's `targetingKey` has no direct Quonfig equivalent. The provider
  ## option `targetingKeyMapping` (default: "user.id") controls which Quonfig
  ## context property receives the targeting key value.
  ##
  ## of.weighted has weighted_values bucketed on user.id (50% variant-a, 50% variant-b).
  ## With targetingKeyMapping: "user.id" and targetingKey: "user-123":
  ##   hash("of.weighted" + "user-123") = 0.0773 -> threshold 7728 < 50000 -> variant-a
  ##
  ## The test confirms that targetingKey flows through the mapping and reaches
  ## the hash function -- not that the hash function itself is correct (that is
  ## covered by get_weighted_values.yaml).
  ##############################################################################
  - cases:
      - name: "targetingKey maps to user.id via targetingKeyMapping for bucketing"
        sdk: openfeature
        client: config_client
        function: resolveStringValue
        type: STRING
        of_context:
          targetingKey: "user-123"
        provider_options:
          targetingKeyMapping: "user.id"
        input:
          key: "of.weighted"
          default: "variant-b"
        expected:
          value: "variant-a"
          reason: SPLIT

  ##############################################################################
  ## Case 6: A malformed value is PARSE_ERROR; a wrong-type read is TYPE_MISMATCH
  ##
  ## (qfg-9xsl, Jeff's decision 2026-10-28.) A value that has the requested
  ## type but cannot be parsed -- a stored int "twelve", or an int provided by
  ## an env var set to "twelve" -- returns the OF default with reason ERROR
  ## and error code PARSE_ERROR. That is a data problem. Reading a config with
  ## the method for another type is a caller problem: TYPE_MISMATCH.
  ##
  ## qfg-verify rejects a malformed stored int/double on push, but an
  ## ENV_VAR-provided value is only read at evaluation time, so the env-var
  ## case is the one customers can actually hit. The stored cases use
  ## fixtures that bypass qfg-verify.
  ##
  ## Providers with separate int and double methods use the one matching
  ## `type`; providers with a single number method use that.
  ##############################################################################
  - cases:
      - name: "malformed stored int via resolveNumberValue returns default with PARSE_ERROR"
        sdk: openfeature
        client: config_client
        function: resolveNumberValue
        type: INT
        input:
          key: "getter.contract.int.malformed"
          default: 7
        expected:
          value: 7
          reason: ERROR
          error_code: PARSE_ERROR

      - name: "malformed stored double via resolveNumberValue returns default with PARSE_ERROR"
        sdk: openfeature
        client: config_client
        function: resolveNumberValue
        type: DOUBLE
        input:
          key: "getter.contract.double.malformed"
          default: 1.5
        expected:
          value: 1.5
          reason: ERROR
          error_code: PARSE_ERROR

      - name: "env-var-provided malformed int via resolveNumberValue returns default with PARSE_ERROR"
        sdk: openfeature
        client: config_client
        function: resolveNumberValue
        type: INT
        input:
          key: "getter.contract.provided.int.malformed"
          default: 7
        env_vars:
          QUONFIG_ITD_GETTER_INT: "twelve"
        expected:
          value: 7
          reason: ERROR
          error_code: PARSE_ERROR

      - name: "int config via resolveBooleanValue returns default with TYPE_MISMATCH"
        sdk: openfeature
        client: config_client
        function: resolveBooleanValue
        type: BOOLEAN
        input:
          key: "getter.contract.int"
          default: false
        expected:
          value: false
          reason: ERROR
          error_code: TYPE_MISMATCH
