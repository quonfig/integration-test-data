---
function: get_or_raise
# note in java get_or_raise is implemented as liveString which doesn't take a context argument
tests:
  - cases:
    - name: get_or_raise can raise an error if value not found
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "my-missing-key"
      expected:
        status: raise
        error: missing_default
        message: "No value found for key 'my-missing-key'"

    - name: get_or_raise returns a default value instead of raising
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "my-missing-key"
        default: "DEFAULT"
      expected:
        value: "DEFAULT"

    # The two init-timeout cases below point at 192.0.2.1 (TEST-NET-1, RFC 5737):
    # it never answers, so the SDK hits its init TIMEOUT rather than a fast
    # connection-refused, and CI never contacts a third-party host (qfg-goi1.6).
    - name: get_or_raise raises the correct error if it doesn't raise on init timeout
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "any-key"
      expected:
        status: raise
        error: missing_default
        message: "No value found for key 'any-key'"
      client_overrides:
        initialization_timeout_sec: 0.01
        prefab_api_url: "http://192.0.2.1:1"
        on_init_failure: :return

    - name: get_or_raise can raise an error if the client does not initialize in time
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "any-key"
      expected:
        status: raise
        error: initialization_timeout
        message: "Prefab couldn't initialize in 0.01 second timeout. Trying to fetch key `any-key`."
      client_overrides:
        initialization_timeout_sec: 0.01
        prefab_api_url: "http://192.0.2.1:1"
        on_init_failure: :raise

    - name: raises an error if a config is provided by a missing environment variable
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "provided.by.missing.env.var"
      expected:
        status: raise
        error: missing_env_var

    - name: raises an error if an env-var-provided config cannot be coerced to configured type
      client: config_client
      function: get_or_raise
      type: INT
      input:
        key: "provided.not.a.number"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    # Coercion error text never carries the env var's value (qfg-goi1.10.11,
    # WS1). Env vars hold secrets, and this message reaches callers, logs and
    # the *_details error_message / OpenFeature error events. Pinned template
    # (sdk-go 4178377, sdk-net 0402468; <type> is the lowercase config-file
    # type name):
    #   environment variable "<NAME>" cannot be converted to <type> for config "<key>"
    # message_contains: the raised error's message contains this string (an
    # SDK may add a prefix or a sanitized reason such as ": parsing int:
    # invalid syntax"). message_excludes: none of these substrings may appear.
    - name: coercion error for an int env var names the variable and never its value
      client: config_client
      function: get_or_raise
      type: INT
      input:
        key: "provided.secret.not.an.int"
      env_vars:
        QUONFIG_ITD_SECRET_ENV: "postgres://admin:hunter2@db"
      expected:
        status: raise
        error: unable_to_coerce_env_var
        message_contains: 'environment variable "QUONFIG_ITD_SECRET_ENV" cannot be converted to int for config "provided.secret.not.an.int"'
        message_excludes:
          - "hunter2"
          - "postgres://"

    - name: coercion error for a double env var names the variable and never its value
      client: config_client
      function: get_or_raise
      type: DOUBLE
      input:
        key: "provided.secret.not.a.double"
      env_vars:
        QUONFIG_ITD_SECRET_ENV: "postgres://admin:hunter2@db"
      expected:
        status: raise
        error: unable_to_coerce_env_var
        message_contains: 'environment variable "QUONFIG_ITD_SECRET_ENV" cannot be converted to double for config "provided.secret.not.a.double"'
        message_excludes:
          - "hunter2"
          - "postgres://"

    - name: raises an error for decryption failure
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "a.broken.secret.config"
      expected:
        status: raise
        error: unable_to_decrypt

    # Malformed durations (qfg-2agi.6, .7): get_or_raise raises the SDK's
    # coercion error for BOTH sources. Jeff's decision: a stored malformed
    # value raises the same coercion error class as an ENV_VAR one, so both
    # use the unable_to_coerce_env_var key. Fixtures and the rest of the
    # contract: see the "Malformed durations" block in get.yaml.
    - name: raises an error if an env-var-provided duration 30s cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "provided.duration.malformed.30s"
      env_vars:
        QUONFIG_ITD_DURATION_30S: "30s"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if an env-var-provided duration PT0.5H cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "provided.duration.malformed.PT0.5H"
      env_vars:
        QUONFIG_ITD_DURATION_PT0_5H: "PT0.5H"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if an env-var-provided duration P1DT cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "provided.duration.malformed.P1DT"
      env_vars:
        QUONFIG_ITD_DURATION_P1DT: "P1DT"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if an env-var-provided duration garbage cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "provided.duration.malformed.garbage"
      env_vars:
        QUONFIG_ITD_DURATION_GARBAGE: "garbage"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if a stored duration 30s cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "test.duration.malformed.30s"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if a stored duration PT0.5H cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "test.duration.malformed.PT0.5H"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if a stored duration P1DT cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "test.duration.malformed.P1DT"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if a stored duration garbage cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "test.duration.malformed.garbage"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if a stored duration empty cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "test.duration.malformed.empty"
      expected:
        status: raise
        error: unable_to_coerce_env_var
