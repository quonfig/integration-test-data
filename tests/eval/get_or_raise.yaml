    - name: raises an error if a stored duration empty cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "test.duration.malformed.empty"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    # Typed-getter contract (qfg-zvyy): get_or_raise legs. The rule and the
    # fixtures are documented on the "Typed-getter contract" block in
    # get.yaml. A wrong-type read raises type_mismatch; a malformed stored or
    # ENV_VAR int/double raises the coercion error (unable_to_coerce_env_var,
    # as for malformed durations); a missing bool env var raises
    # missing_env_var. Safe int <-> double conversions return the value.
    - name: STRING get_or_raise on stored int raises type_mismatch
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "getter.contract.int"
      expected:
        status: "raise"
        error: "type_mismatch"

    - name: STRING get_or_raise on stored double raises type_mismatch
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "getter.contract.double"
      expected:
        status: "raise"
        error: "type_mismatch"

