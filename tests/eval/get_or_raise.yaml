        error: unable_to_coerce_env_var

    - name: raises an error if an env-var-provided duration garbage cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "provided.duration.malformed.garbage"
      env_vars:
        QUONFIG_ITD_DURATION_GARBAGE: "garbage"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if a stored duration 30s cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "test.duration.malformed.30s"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if a stored duration PT0.5H cannot be coerced
      client: config_client
      function: get_or_raise
