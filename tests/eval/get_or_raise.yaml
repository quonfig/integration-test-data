---
function: get_or_raise
# note in java get_or_raise is implemented as liveString which doesn't take a context argument
tests:
  - cases:
    - name: get_or_raise can raise an error if value not found
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "my-missing-key"
      expected:
        status: raise
        error: missing_default
        message: "No value found for key 'my-missing-key'"

    - name: get_or_raise returns a default value instead of raising
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "my-missing-key"
        default: "DEFAULT"
      expected:
        value: "DEFAULT"

    # Init failure (qfg-9p4i.6). Spec: project/plans/2026-10-05-init-failure-design.md
    # (its Decisions section wins), sections B.1-B.4 and D. Parsed for every
    # target by generators/src/shared/init-failure.ts, which documents the keys:
    #   on_init_failure: fail | wait | continue, or the deprecated aliases
    #     raise (= fail) and return (= continue), passed to the SDK verbatim.
    #     Absent = the SDK default, which is fail in every SDK.
    #   init_timeout_ms: the SDK's initTimeout.
    #   api_urls: every delivery leg. 127.0.0.1:1 and :2 refuse at once;
    #     192.0.2.1 (TEST-NET-1, RFC 5737) never answers, so the SDK hangs
    #     until its init timeout. CI never contacts a third-party host. Hung
    #     legs use ports 8001/8002: port 1 is on the WHATWG fetch bad-ports
    #     list, so node's fetch would fail it at once instead of hanging.
    #   api_status: in place of api_urls, one local server per leg answering
    #     every request with this status (a number = two legs; a list = one
    #     leg per entry). api_body: the body those legs send.
    # function: init asserts the init call itself (go NewClient, node init(),
    # python init(), ruby Client.new, net InitAsync, java init):
    #   error initialization_timeout: the SDK's init-timeout error (go:
    #     errors.Is ErrInitializationTimeout; elsewhere the QuonfigInitTimeout*
    #     subclass of the init error).
    #   error init_failed: the SDK's init error (QuonfigInitError family; go: a
    #     non-nil error and no client) that is NOT the timeout error.
    #   reason: unavailable | unauthorized | timeout (B.4), asserted on the
    #     init error's reason in every SDK; the error key carries the timeout
    #     split as well.
    #   raises_within_ms: wall-clock bound on the init call, start to raise.
    # fail retries through blips until init_timeout_ms (B.3), so refused legs
    # raise at the timeout with reason unavailable; only an auth-class status
    # (401/403/404/410) on every leg raises at once. A getter case on one of these clients uses continue: init
    # returns and the getter answers as an empty store would.
    - name: init fails by default when every delivery leg refuses the connection
      client: config_client
      function: init
      expected:
        status: raise
        error: init_failed
        reason: unavailable
        raises_within_ms: 5000
      client_overrides:
        init_timeout_ms: 500
        api_urls: ["http://127.0.0.1:1", "http://127.0.0.1:2"]

    - name: init with on_init_failure fail raises when every delivery leg refuses the connection
      client: config_client
      function: init
      expected:
        status: raise
        error: init_failed
        reason: unavailable
        raises_within_ms: 5000
      client_overrides:
        on_init_failure: fail
        init_timeout_ms: 500
        api_urls: ["http://127.0.0.1:1", "http://127.0.0.1:2"]

    - name: init with on_init_failure fail raises the init timeout when every delivery leg hangs
      client: config_client
      function: init
      expected:
        status: raise
        error: initialization_timeout
        reason: timeout
        raises_within_ms: 2000
      client_overrides:
        on_init_failure: fail
        init_timeout_ms: 200
        api_urls: ["http://192.0.2.1:8001", "http://192.0.2.1:8002"]

    - name: init with on_init_failure fail raises at once when every delivery leg answers 401
      client: config_client
      function: init
      expected:
        status: raise
        error: init_failed
        reason: unauthorized
        # Well inside init_timeout_ms: an SDK that waits out the timeout on a
        # rejected key fails this bound.
        raises_within_ms: 4000
      client_overrides:
        on_init_failure: fail
        init_timeout_ms: 8000
        api_status: 401

    - name: get_or_raise returns the default after init continues past refused delivery legs
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "any-key"
        default: "DEFAULT"
      expected:
        value: "DEFAULT"
      client_overrides:
        on_init_failure: continue
        init_timeout_ms: 500
        api_urls: ["http://127.0.0.1:1", "http://127.0.0.1:2"]

    - name: get_or_raise raises missing_default after init continues past refused delivery legs
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "any-key"
      expected:
        status: raise
        error: missing_default
        message: "No value found for key 'any-key'"
      client_overrides:
        on_init_failure: continue
        init_timeout_ms: 500
        api_urls: ["http://127.0.0.1:1", "http://127.0.0.1:2"]

    - name: deprecated on_init_failure raise behaves as fail when every delivery leg refuses the connection
      client: config_client
      function: init
      expected:
        status: raise
        error: init_failed
        reason: unavailable
        raises_within_ms: 5000
      client_overrides:
        on_init_failure: raise
        init_timeout_ms: 500
        api_urls: ["http://127.0.0.1:1", "http://127.0.0.1:2"]

    - name: deprecated on_init_failure return behaves as continue when every delivery leg refuses the connection
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "any-key"
      expected:
        status: raise
        error: missing_default
        message: "No value found for key 'any-key'"
      client_overrides:
        on_init_failure: return
        init_timeout_ms: 500
        api_urls: ["http://127.0.0.1:1", "http://127.0.0.1:2"]

    # Cross-SDK conformance (qfg-9p4i.17; design doc "Decisions (Jeff,
    # 2026-10-21)", items 6-9):
    #   6. "unauthorized" (fast-fail) only when EVERY leg answers auth-class,
    #      and the auth-class set is 401/403/404/410.
    #   7. reason timeout iff the last attempt hung (every leg timed out or
    #      was aborted) or no attempt completed; otherwise unavailable.
    #   8. init_timeout_ms <= 0 = exactly one attempt, then on_init_failure.
    #   9. The init error (and its cause chain) never carries URL userinfo or
    #      an upstream response body.
    # api_status as a list sets one local leg per entry (primary, secondary);
    # api_body is the body every local leg sends. message_excludes on an init
    # case covers the error message and every message in its cause chain.
    - name: init with on_init_failure fail raises at once when every delivery leg answers 404
      client: config_client
      function: init
      expected:
        status: raise
        error: init_failed
        reason: unauthorized
        raises_within_ms: 4000
      client_overrides:
        on_init_failure: fail
        init_timeout_ms: 8000
        api_status: 404

    - name: init with on_init_failure fail raises at once when every delivery leg answers 410
      client: config_client
      function: init
      expected:
        status: raise
        error: init_failed
        reason: unauthorized
        raises_within_ms: 4000
      client_overrides:
        on_init_failure: fail
        init_timeout_ms: 8000
        api_status: 410

    # Only the primary rejects the key: not every leg is auth-class, so init
    # keeps retrying and raises unavailable at the timeout (Decision 6).
    - name: init with on_init_failure fail raises unavailable when only the primary answers 401 and the secondary 503
      client: config_client
      function: init
      expected:
        status: raise
        error: init_failed
        reason: unavailable
        raises_within_ms: 6000
      client_overrides:
        on_init_failure: fail
        init_timeout_ms: 1500
        api_status: [401, 503]

    # init_timeout_ms 0 runs one attempt, then applies on_init_failure. An SDK
    # that treats 0 as "no deadline" blocks forever and fails the bound.
    - name: init with init_timeout_ms 0 and on_init_failure fail raises after one attempt when every delivery leg refuses the connection
      client: config_client
      function: init
      expected:
        status: raise
        error: init_failed
        reason: unavailable
        raises_within_ms: 5000
      client_overrides:
        on_init_failure: fail
        init_timeout_ms: 0
        api_urls: ["http://127.0.0.1:1", "http://127.0.0.1:2"]

    - name: get_or_raise returns the default after init with init_timeout_ms 0 continues past refused delivery legs
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "any-key"
        default: "DEFAULT"
      expected:
        value: "DEFAULT"
      client_overrides:
        on_init_failure: continue
        init_timeout_ms: 0
        api_urls: ["http://127.0.0.1:1", "http://127.0.0.1:2"]

    # The per-leg aborts fire before the deadline here, so the first attempt
    # completes with every leg aborted: still a hang, reason timeout
    # (Decision 7). Every backend SDK (go, node, python, ruby, java, net)
    # defaults to hedge delay 2s and per-leg abort 6s measured from the leg's
    # start, so attempt 1 ends at about 2 + 6 = 8s. 10000ms (the server
    # default initTimeout) clears that with 2s of margin; the next attempt is
    # still hanging when the deadline hits.
    - name: init with on_init_failure fail raises the init timeout when every delivery leg hangs past its per-leg abort
      client: config_client
      function: init
      expected:
        status: raise
        error: initialization_timeout
        reason: timeout
        raises_within_ms: 14000
      client_overrides:
        on_init_failure: fail
        init_timeout_ms: 10000
        api_urls: ["http://192.0.2.1:8001", "http://192.0.2.1:8002"]

    - name: init error never carries the userinfo of a delivery URL
      client: config_client
      function: init
      expected:
        status: raise
        error: init_failed
        reason: unavailable
        raises_within_ms: 5000
        message_excludes:
          - "qfgsecret"
          - "qfguser"
      client_overrides:
        on_init_failure: fail
        init_timeout_ms: 500
        api_urls: ["http://qfguser:qfgsecret@127.0.0.1:1", "http://qfguser:qfgsecret@127.0.0.1:2"]

    - name: init error never carries an upstream response body
      client: config_client
      function: init
      expected:
        status: raise
        error: init_failed
        reason: unavailable
        raises_within_ms: 5000
        message_excludes:
          - "qfg-upstream-body-marker"
      client_overrides:
        on_init_failure: fail
        init_timeout_ms: 500
        api_status: 503
        api_body: "upstream exploded: qfg-upstream-body-marker"

    - name: raises an error if a config is provided by a missing environment variable
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "provided.by.missing.env.var"
      expected:
        status: raise
        error: missing_env_var

    - name: raises an error if an env-var-provided config cannot be coerced to configured type
      client: config_client
      function: get_or_raise
      type: INT
      input:
        key: "provided.not.a.number"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    # Coercion error text never carries the env var's value (qfg-goi1.10.11,
    # WS1). Env vars hold secrets, and this message reaches callers, logs and
    # the *_details error_message / OpenFeature error events. Pinned template
    # (sdk-go 4178377, sdk-net 0402468; <type> is the lowercase config-file
    # type name):
    #   environment variable "<NAME>" cannot be converted to <type> for config "<key>"
    # message_contains: the raised error's message contains this string (an
    # SDK may add a prefix or a sanitized reason such as ": parsing int:
    # invalid syntax"). message_excludes: none of these substrings may appear.
    - name: coercion error for an int env var names the variable and never its value
      client: config_client
      function: get_or_raise
      type: INT
      input:
        key: "provided.secret.not.an.int"
      env_vars:
        QUONFIG_ITD_SECRET_ENV: "postgres://admin:hunter2@db"
      expected:
        status: raise
        error: unable_to_coerce_env_var
        message_contains: 'environment variable "QUONFIG_ITD_SECRET_ENV" cannot be converted to int for config "provided.secret.not.an.int"'
        message_excludes:
          - "hunter2"
          - "postgres://"

    - name: coercion error for a double env var names the variable and never its value
      client: config_client
      function: get_or_raise
      type: DOUBLE
      input:
        key: "provided.secret.not.a.double"
      env_vars:
        QUONFIG_ITD_SECRET_ENV: "postgres://admin:hunter2@db"
      expected:
        status: raise
        error: unable_to_coerce_env_var
        message_contains: 'environment variable "QUONFIG_ITD_SECRET_ENV" cannot be converted to double for config "provided.secret.not.a.double"'
        message_excludes:
          - "hunter2"
          - "postgres://"

    - name: raises an error for decryption failure
      client: config_client
      function: get_or_raise
      type: STRING
      input:
        key: "a.broken.secret.config"
      expected:
        status: raise
        error: unable_to_decrypt

    # Malformed durations (qfg-2agi.6, .7): get_or_raise raises the SDK's
    # coercion error for BOTH sources. Jeff's decision: a stored malformed
    # value raises the same coercion error class as an ENV_VAR one, so both
    # use the unable_to_coerce_env_var key. Fixtures and the rest of the
    # contract: see the "Malformed durations" block in get.yaml.
    - name: raises an error if an env-var-provided duration 30s cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "provided.duration.malformed.30s"
      env_vars:
        QUONFIG_ITD_DURATION_30S: "30s"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if an env-var-provided duration PT0.5H cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "provided.duration.malformed.PT0.5H"
      env_vars:
        QUONFIG_ITD_DURATION_PT0_5H: "PT0.5H"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if an env-var-provided duration P1DT cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "provided.duration.malformed.P1DT"
      env_vars:
        QUONFIG_ITD_DURATION_P1DT: "P1DT"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if an env-var-provided duration garbage cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "provided.duration.malformed.garbage"
      env_vars:
        QUONFIG_ITD_DURATION_GARBAGE: "garbage"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if a stored duration 30s cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "test.duration.malformed.30s"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if a stored duration PT0.5H cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "test.duration.malformed.PT0.5H"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if a stored duration P1DT cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "test.duration.malformed.P1DT"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if a stored duration garbage cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "test.duration.malformed.garbage"
      expected:
        status: raise
        error: unable_to_coerce_env_var

    - name: raises an error if a stored duration empty cannot be coerced
      client: config_client
      function: get_or_raise
      type: DURATION
      input:
        key: "test.duration.malformed.empty"
      expected:
        status: raise
        error: unable_to_coerce_env_var
