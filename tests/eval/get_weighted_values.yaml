---
function: get
tests:
  - cases:
    - name: weighted value is consistent 1
      client: config_client
      function: get
      type: INT
      contexts:
        local:
          user:
            tracking_id: "a72c15f5"
      input:
        flag: "feature-flag.weighted"
      expected:
        value: 1
    - name: weighted value is consistent 2
      client: config_client
      function: get
      type: INT
      contexts:
        local:
          user:
            tracking_id: "92a202f2"
      input:
        flag: "feature-flag.weighted"
      expected:
        value: 2
    - name: weighted value is consistent 3
      client: config_client
      function: get
      type: INT
      contexts:
        local:
          user:
            tracking_id: "8f414100"
      input:
        flag: "feature-flag.weighted"
      expected:
        value: 3
  - cases:
    # Weight-scale contract (qfg-wis6.13): SDKs normalize by TOTAL weight,
    # not a fixed 100000 scale. The all-equal form (1/1) is the canonical
    # even-split encoding and serves 50/50. tracking_ids chosen mid-bucket
    # (hash fractions ~0.21-0.26 for "a", ~0.73-0.74 for "b").
    - name: even split ones serves first variant at low hash fraction
      client: config_client
      function: get
      type: STRING
      contexts:
        local:
          user:
            tracking_id: "b7ff78c8"
      input:
        flag: "feature-flag.weighted.even-split-ones"
      expected:
        value: "a"
    - name: even split ones serves first variant at low hash fraction 2
      client: config_client
      function: get
      type: STRING
      contexts:
        local:
          user:
            tracking_id: "289f4748"
      input:
        flag: "feature-flag.weighted.even-split-ones"
      expected:
        value: "a"
    - name: even split ones serves second variant at high hash fraction
      client: config_client
      function: get
      type: STRING
      contexts:
        local:
          user:
            tracking_id: "d60b2cb6"
      input:
        flag: "feature-flag.weighted.even-split-ones"
      expected:
        value: "b"
    - name: even split ones serves second variant at high hash fraction 2
      client: config_client
      function: get
      type: STRING
      contexts:
        local:
          user:
            tracking_id: "21bcfd13"
      input:
        flag: "feature-flag.weighted.even-split-ones"
      expected:
        value: "b"
  - cases:
    # Resilience contract (qfg-wis6.13): the stored weights sum to 180000
    # (deliberately non-conforming fixture — never round-trip it through qfg
    # tooling). Evaluation normalizes by total: true wins for fractions
    # <= 100000/180000 (~0.5556). tracking_ids chosen mid-bucket
    # (~0.30 for true, ~0.76-0.83 for false).
    - name: non-standard sum still serves normalized true bucket
      client: config_client
      function: get
      type: BOOL
      contexts:
        local:
          user:
            tracking_id: "ff8adf17"
      input:
        flag: "feature-flag.weighted.non-standard"
      expected:
        value: true
    - name: non-standard sum still serves normalized true bucket 2
      client: config_client
      function: get
      type: BOOL
      contexts:
        local:
          user:
            tracking_id: "36ef1a7a"
      input:
        flag: "feature-flag.weighted.non-standard"
      expected:
        value: true
    - name: non-standard sum still serves normalized false bucket
      client: config_client
      function: get
      type: BOOL
      contexts:
        local:
          user:
            tracking_id: "f667c76a"
      input:
        flag: "feature-flag.weighted.non-standard"
      expected:
        value: false
    - name: non-standard sum still serves normalized false bucket 2
      client: config_client
      function: get
      type: BOOL
      contexts:
        local:
          user:
            tracking_id: "7467ca21"
      input:
        flag: "feature-flag.weighted.non-standard"
      expected:
        value: false
  - cases:
    # Missing/empty hash-property contract (qfg-9dxb.8, revised 2026-09-28,
    # Statsig-style): when hashByPropertyName (user.tracking_id) is MISSING
    # from the context (property absent, named context absent, or no context)
    # or present as an EMPTY STRING, SDKs hash configKey + "" and walk the
    # weights normally. murmur3("feature-flag.weighted") / MaxUint32 =
    # 0.918 -> 91798 of 100000 -> value 2. Missing and empty resolve to the
    # same variant. Reason stays SPLIT; hashPropertyMissing metadata is
    # asserted in native per-SDK tests (the YAML schema has no metadata
    # assertion). Supersedes the "first variant" expectations of cc1177a.
    - name: weighted value with hash property missing from context hashes empty string
      client: config_client
      function: get
      type: INT
      contexts:
        local:
          user:
            key: "no-tracking-id-user"
      input:
        flag: "feature-flag.weighted"
      expected:
        value: 2
    - name: weighted value with no context hashes empty string
      client: config_client
      function: get
      type: INT
      input:
        flag: "feature-flag.weighted"
      expected:
        value: 2
    - name: weighted value with hash property empty string hashes empty string
      client: config_client
      function: get
      type: INT
      contexts:
        local:
          user:
            key: "empty-tracking-id-user"
            tracking_id: ""
      input:
        flag: "feature-flag.weighted"
      expected:
        value: 2
    # feature-flag.weighted.zero-first: first variant (1) has weight 0, second
    # (2) has 100000. A 0% variant must never be served, even when the hash
    # property is missing (a literal "bucket 0 / first variant" fallback
    # would wrongly serve 1). murmur3("feature-flag.weighted.zero-first") /
    # MaxUint32 = 0.164 -> value 2.
    - name: weighted value with zero-weight first variant and hash property missing never serves zero-weight variant
      client: config_client
      function: get
      type: INT
      contexts:
        local:
          user:
            key: "no-tracking-id-user"
      input:
        flag: "feature-flag.weighted.zero-first"
      expected:
        value: 2
