---
function: get
tests:
  - cases:
      - name: get returns a found value for key
        client: config_client
        function: get
        type: STRING
        input:
          key: "my-test-key"
        expected:
          value: "my-test-value"

      - name: get returns nil if value not found
        client: config_client
        function: get
        type: STRING
        input:
          key: "my-missing-key"
        expected:
          value: ~
        client_overrides:
          on_no_default: 2

      - name: get returns a default for a missing value if a default is given
        client: config_client
        function: get
        type: STRING
        input:
          key: "my-missing-key"
          default: "DEFAULT"
        expected:
          value: "DEFAULT"

      - name: get ignores a provided default if the key is found
        client: config_client
        function: get
        type: STRING
        input:
          key: "my-test-key"
          default: "DEFAULT"
        expected:
          value: "my-test-value"

      - name: get can return a double
        client: config_client
        function: get
        type: DOUBLE
        input:
          key: "my-double-key"
        expected:
          value: 9.95

      - name: get can return a string list
        client: config_client
        function: get
        type: STRING_LIST
        input:
          key: "my-string-list-key"
        expected:
          value:
            - a
            - b
            - c

      - name: can return a value provided by an environment variable
        client: config_client
        function: get
        type: STRING
        input:
          key: "greeting.from.env"
        env_vars:
          GREETING: "hello from the environment"
        expected:
          value: "hello from the environment"

      - name: can return a value provided by an environment variable after type coercion
        client: config_client
        function: get
        type: INT
        input:
          key: "provided.a.number"
        expected:
          value: 1234

      ##########################################################################
      ## qf1 secrets (bead qfg-8seuf.3; spec project/plans/secrets-qf1-spec.md).
      ## Fixtures: data/integration-tests/secrets/qf1.secret.*.json, written by
      ## `npm run qf1:sync` from tests/secrets/qf1-vectors.json (the spec's
      ## known-answer vectors); the old-format twins are configs/qf1.*.json.
      ## A secret is read through the normal typed getter.
      ##
      ## `keysets:` gives the case's environment its QUONFIG_KEYSET* env vars
      ## by TEST-KEY LABEL; each generator derives the private entries at run
      ## time (generators/src/shared/qf1.ts), so no key material is written
      ## here or into any SDK's generated tests. Every case declares the SAME
      ## keysets (the vectors' three, shared/qf1.test.ts checks it): an SDK
      ## may cache a parsed keyset for the life of the process (spec 6.2).
      ##
      ## Failures assert only the SDK's mapped unable-to-decrypt behaviour
      ## (spec decision 41): here the caller's default or the absent value,
      ## in get_or_raise.yaml `error: unable_to_decrypt`. The qf1 error class
      ## (key_not_held, malformed, ...) is asserted by each SDK's unit tests
      ## against the vectors. Each failing fixture fails ONLY its own value:
      ## every other case here runs against the same workspace.
      ##########################################################################
      - name: decrypts a qf1 secret
        client: config_client
        function: get
        type: STRING
        input:
          key: "qf1.secret.short"
        keysets: &qf1_keysets
          QUONFIG_KEYSET_TEST: ["QUONFIG_KEYSET_TEST/1"]
          QUONFIG_KEYSET: ["QUONFIG_KEYSET/1"]
          QUONFIG_KEYSET_TEST_PROD: ["QUONFIG_KEYSET_TEST_PROD/new", "QUONFIG_KEYSET_TEST_PROD/old"]
        expected:
          value: "hello"

      - name: decrypts a qf1 secret whose value is the empty string
        client: config_client
        function: get
        type: STRING
        input:
          key: "qf1.secret.empty"
        keysets: *qf1_keysets
        expected:
          value: ""

      - name: decrypts a qf1 secret with multi-byte UTF-8
        client: config_client
        function: get
        type: STRING
        input:
          key: "qf1.secret.multibyte"
        keysets: *qf1_keysets
        expected:
          value: "pässwörd 日本語 🔑"

      - name: decrypts a qf1 secret and keeps its leading U+FEFF
        client: config_client
        function: get
        type: STRING
        input:
          key: "qf1.secret.leading.bom"
        keysets: *qf1_keysets
        expected:
          value: "\U0000FEFFbom stays"

      - name: decrypts a qf1 secret with quotes, backslash, newline, tab and colons
        client: config_client
        function: get
        type: STRING
        input:
          key: "qf1.secret.json.special"
        keysets: *qf1_keysets
        expected:
          value: "a\"b\\c\nd\te:f,g qf1:x"

      - name: decrypts a qf1 secret on the bare QUONFIG_KEYSET keyset
        client: config_client
        function: get
        type: STRING
        input:
          key: "qf1.secret.default.keyset"
        keysets: *qf1_keysets
        expected:
          value: "sk_test_default_keyset_value"

      - name: decrypts a qf1 secret encrypted to the second key of a two-key keyset
        client: config_client
        function: get
        type: STRING
        input:
          key: "qf1.secret.older.key"
        keysets: *qf1_keysets
        expected:
          value: "written before rotation"

      # Default rule on QUONFIG_KEYSET, Production rule on
      # QUONFIG_KEYSET_TEST_PROD (spec 10.2): the client's environment picks
      # the value, and so the keyset.
      - name: decrypts the environment-scoped value of a qf1 secret on a second keyset
        client: config_client
        function: get
        type: STRING
        input:
          key: "qf1.secret.env.scoped"
        keysets: *qf1_keysets
        expected:
          value: "written with the first public key"

      # qf1.secret.shadowed is in BOTH configs/ (old value with decryptWith)
      # and secrets/ (qf1). Datadir mode loads secrets/ last, so the secret
      # wins (spec 13.7); a reader of the configs/ copy would fail (R1).
      - name: a qf1 secret shadows a document with the same key in configs
        client: config_client
        function: get
        type: STRING
        input:
          key: "qf1.secret.shadowed"
        keysets: *qf1_keysets
        expected:
          value: "hello"

