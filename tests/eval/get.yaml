---
function: get
tests:
  - cases:
      - name: get returns a found value for key
        client: config_client
        function: get
        type: STRING
        input:
          key: "my-test-key"
        expected:
          value: "my-test-value"

      - name: get returns nil if value not found
        client: config_client
        function: get
        type: STRING
        input:
          key: "my-missing-key"
        expected:
          value: ~
        client_overrides:
          on_no_default: 2

      - name: get returns a default for a missing value if a default is given
        client: config_client
        function: get
        type: STRING
        input:
          key: "my-missing-key"
          default: "DEFAULT"
        expected:
          value: "DEFAULT"

      - name: get ignores a provided default if the key is found
        client: config_client
        function: get
        type: STRING
        input:
          key: "my-test-key"
          default: "DEFAULT"
        expected:
          value: "my-test-value"

      - name: get can return a double
        client: config_client
        function: get
        type: DOUBLE
        input:
          key: "my-double-key"
        expected:
          value: 9.95

      - name: get can return a string list
        client: config_client
        function: get
        type: STRING_LIST
        input:
          key: "my-string-list-key"
        expected:
          value:
            - a
            - b
            - c

      - name: can return a value provided by an environment variable
        client: config_client
        function: get
        type: STRING
        input:
          key: "prefab.secrets.encryption.key"
        expected:
          value: "c87ba22d8662282abe8a0e4651327b579cb64a454ab0f4c170b45b15f049a221"


      - name: can return a value provided by an environment variable after type coercion
        client: config_client
        function: get
        type: INT
        input:
          key: "provided.a.number"
        expected:
          value: 1234

      - name: can decrypt and return a secret value (with decryption key in in env var)
        client: config_client
        function: get
        type: STRING
        input:
          key: "a.secret.config"
        expected:
          value: "hello.world"

      - name: duration 200 ms
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.PT0.2S"
        expected:
          millis: 200

      - name: duration 90S
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.PT90S"
        expected:
          millis: 90000

      - name: duration 30M
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.PT30M"
        expected:
          millis: 1800000

      - name: duration test.duration.P1DT6H2M1.5S
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.P1DT6H2M1.5S"
        expected:
          millis: 108121500

      # Grammar coverage (qfg-2agi.5): every component, leading zero, zero,
      # the magnitude ceiling, and exact-decimal half-up rounding to integer ms.
      # Same values and millis as tests/duration/grammar.yaml.
      - name: duration zero PT0S
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.PT0S"
        expected:
          millis: 0

      - name: duration zero P0D
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.P0D"
        expected:
          millis: 0

      - name: duration days only P2D
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.P2D"
        expected:
          millis: 172800000

      - name: duration hours only PT1H
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.PT1H"
        expected:
          millis: 3600000

      - name: duration minutes only PT1M
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.PT1M"
        expected:
          millis: 60000

      - name: duration seconds only PT1S
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.PT1S"
        expected:
          millis: 1000

      - name: duration leading zero PT05S
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.PT05S"
        expected:
          millis: 5000

      - name: duration hours and minutes PT1H30M
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.PT1H30M"
        expected:
          millis: 5400000

      - name: duration days and hours P1DT2H
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.P1DT2H"
        expected:
          millis: 93600000

      - name: duration one millisecond PT0.001S
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.PT0.001S"
        expected:
          millis: 1

      - name: duration magnitude ceiling P36500D
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.P36500D"
        expected:
          millis: 3153600000000

      - name: duration rounding PT2.01S
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.PT2.01S"
        expected:
          millis: 2010

      - name: duration rounding PT1.005S
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.PT1.005S"
        expected:
          millis: 1005

      - name: duration rounding half up PT0.0005S
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.PT0.0005S"
        expected:
          millis: 1

      - name: duration rounding down PT0.0004S
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.PT0.0004S"
        expected:
          millis: 0

      - name: json test
        client: config_client
        function: get
        type: JSON
        input:
          key: "test.json"
        expected:
          value:
            a: 1
            b: c

      - name: get returns a native json object (not a stringified payload)
        client: config_client
        function: get
        type: JSON
        input:
          key: "test.json"
        expected:
          value:
            a: 1
            b: "c"

      - name: list on left side test (1)
        client: config_client
        function: get
        type: STRING
        input:
          key: "left.hand.list.test"
        contexts:
          local:
            user:
              name: james
              aka:
                - happy
                - sleepy
        expected:
          value: "correct"

      - name: list on left side test (2)
        client: config_client
        function: get
        type: STRING
        input:
          key: "left.hand.list.test"
        contexts:
          local:
            user:
              name: james
              aka:
                - a
                - b
        expected:
          value: "default"

      - name: list on left side test opposite (1)
        client: config_client
        function: get
        type: STRING
        input:
          key: "left.hand.test.opposite"
        contexts:
          local:
            user:
              name: james
              aka:
                - happy
                - sleepy
        expected:
          value: "default"

      - name: list on left side test (3)
        client: config_client
        function: get
        type: STRING
        input:
          key: "left.hand.test.opposite"
        contexts:
          local:
            user:
              name: james
              aka:
                - a
                - b
        expected:
          value: "correct"


