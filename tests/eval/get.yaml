      ##########################################################################
      ## Malformed durations, stored and ENV_VAR-provided (qfg-2agi.6, .7).
      ##
      ## One contract for both sources (Jeff, 2026-10-01; plan
      ## project/plans/2026-10-01-duration-validity.md, decision 3):
      ##   - typed getter WITH a default -> the caller's default. Never 0, the
      ##     raw string, or an exception. The SDK also logs a warning once per
      ##     key; ITD cannot assert logging, so that half is unchecked here.
      ##   - typed getter with NO default -> the SDK's absent value
      ##     (null/None/nil, or zero with ok=false in Go). Mirrors "get returns
      ##     nil if value not found" (on_no_default: 2).
      ##   - get_or_raise -> raises (see get_or_raise.yaml).
      ## input.default on a DURATION case is integer MILLISECONDS, the same unit
      ## as expected.millis; each generator converts it to its SDK's unit
      ## (e.g. seconds in sdk-python).
      ## Malformed inputs come from tests/duration/grammar.yaml `invalid`.
      ## ENV_VAR cases set their variable via env_vars; the empty string is
      ## stored-only because .NET's Environment.SetEnvironmentVariable(k, "")
      ## deletes the variable, so an empty env var reads as missing_env_var.
      ##########################################################################
      - name: env-var-provided duration PT1.5S via get
        client: config_client
        function: get
        type: DURATION
        input:
          key: "provided.duration.PT1.5S"
        env_vars:
          QUONFIG_ITD_DURATION_PT1_5S: "PT1.5S"
        expected:
          millis: 1500

      - name: stored malformed duration 30s returns the default
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.malformed.30s"
          default: 7000
        expected:
          millis: 7000

      - name: stored malformed duration 30s with no default returns nil
        client: config_client
        function: get
        type: DURATION
        input:
          key: "test.duration.malformed.30s"
        expected:
          value: ~
        client_overrides:
