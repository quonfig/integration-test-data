---
function: get
tests:
  - cases:
      - name: get returns a found value for key
        client: config_client
        function: get
        type: STRING
        input:
          key: "my-test-key"
        expected:
          value: "my-test-value"

      - name: get returns nil if value not found
        client: config_client
        function: get
        type: STRING
        input:
          key: "my-missing-key"
        expected:
          value: ~
        client_overrides:
          on_no_default: 2

      - name: get returns a default for a missing value if a default is given
        client: config_client
        function: get
        type: STRING
        input:
          key: "my-missing-key"
          default: "DEFAULT"
        expected:
          value: "DEFAULT"

      - name: get ignores a provided default if the key is found
        client: config_client
        function: get
        type: STRING
        input:
          key: "my-test-key"
          default: "DEFAULT"
        expected:
          value: "my-test-value"

      - name: get can return a double
        client: config_client
        function: get
        type: DOUBLE
        input:
          key: "my-double-key"
        expected:
          value: 9.95

      - name: get can return a string list
        client: config_client
        function: get
        type: STRING_LIST
        input:
          key: "my-string-list-key"
        expected:
          value:
            - a
            - b
            - c

      - name: can return a value provided by an environment variable
        client: config_client
        function: get
        type: STRING
        input:
          key: "prefab.secrets.encryption.key"
        expected:
          value: "c87ba22d8662282abe8a0e4651327b579cb64a454ab0f4c170b45b15f049a221"


      - name: can return a value provided by an environment variable after type coercion
        client: config_client
        function: get
        type: INT
        input:
          key: "provided.a.number"
        expected:
          value: 1234

      - name: can decrypt and return a secret value (with decryption key in in env var)
        client: config_client
        function: get
        type: STRING
        input:
          key: "a.secret.config"
        expected:
          value: "hello.world"

      # The decryption key config is evaluated like any config, for the
      # client's environment with criteria honored: environment rules first,
      # then default (qfg-goi1.10.11, WS9). env.scoped.encryption.key has a
      # wrong key in its default row and, in Production, a non-matching
      # criteria row (wrong key) above an ALWAYS_TRUE row providing the real
      # key from PREFAB_INTEGRATION_TEST_ENCRYPTION_KEY. Only that row
      # decrypts env.scoped.secret (same ciphertext as a.secret.config).
      - name: decrypts a secret whose key config has an environment rule
        client: config_client
        function: get
        type: STRING
        input:
          key: "env.scoped.secret"
        expected:
          value: "hello.world"

