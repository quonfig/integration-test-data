      ##########################################################################
      ## Typed-getter contract (qfg-zvyy; JEFF'S DECISIONS 2026-10-22/23 on the
      ## bead). Generalizes the malformed-durations rule above to every type
      ## and every failed read:
      ##   - type mismatch: the stored valueType is not the getter's type. No
      ##     string coercion: stored "false" is never a bool, "3" never an int,
      ##     "PT1S" never a duration.
      ##   - int <-> double: safe conversions only. A double getter on an int
      ##     always succeeds (30 -> 30.0); an int getter on a double succeeds
      ##     only when the value is whole and within +/-(2^53-1) (3.0 -> 3).
      ##     3.9, 1e300 and 2^53 are type mismatches. Never truncate.
      ##   - malformed stored or ENV_VAR int/double (qfg-zqoh), a missing
      ##     ENV_VAR and a decryption failure follow the same rule.
      ## For every failed read:
      ##   - typed getter WITH a default -> the caller's default (the SDK also
      ##     logs once per key; ITD cannot assert logging).
      ##   - typed getter with NO default -> the SDK's absent value
      ##     (null/None/nil; zero with ok=false in Go).
      ##   - get_or_raise -> raises (see get_or_raise.yaml): type_mismatch for a
      ##     wrong type, unable_to_coerce_env_var for a malformed value (same
      ##     key as malformed durations), missing_env_var / unable_to_decrypt.
      ##   - enabled never raises: false (see enabled.yaml).
      ## Fixtures: data/integration-tests/configs/getter.contract.*.json.
      ##########################################################################
      - name: STRING getter on stored int returns the default
        client: config_client
        function: get
        type: STRING
        input:
          key: "getter.contract.int"
          default: "DEFAULT"
        expected:
          value: "DEFAULT"

