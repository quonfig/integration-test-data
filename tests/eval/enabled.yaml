      ###################################################################
      ## Regex evaluation contract (qfg-ktkr.1, "Quonfig regex v1")     ##
      ##                                                                ##
      ## Matching is an unanchored SEARCH; anchors pin the whole value. ##
      ## A pattern no engine compiles, a non-string context value and a ##
      ## missing property make BOTH PROP_MATCHES and                    ##
      ## PROP_DOES_NOT_MATCH false. Which patterns writers accept is    ##
      ## tests/regex/dialect.yaml; SDKs do not validate. Context values ##
      ## containing a newline are out of contract (no cases).           ##
      ###################################################################

      - name: returns true for PROP_MATCHES when the regex matches part of the prop (unanchored search)
        client: feature_flag_client
        function: enabled
        contexts:
          block:
            user:
              code: xaab
        input:
          flag: "feature-flag.matches"
        expected:
          value: true

      - name: returns false for PROP_DOES_NOT_MATCH when the regex matches part of the prop (unanchored search)
        client: feature_flag_client
        function: enabled
        contexts:
          block:
            user:
              code: xaab
        input:
          flag: "feature-flag.does-not-match"
        expected:
          value: false

      # feature-flag.matches.anchored: user.code PROP_MATCHES ^[0-9]{3}$

      - name: returns true for PROP_MATCHES with an anchored regex when the whole prop matches
        client: feature_flag_client
