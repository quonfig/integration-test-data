      ##################################################################
      ## OPERATOR EDGES (qfg-goi1.5) ##
      ##
      ## Pins the canonical cross-SDK operator semantics from
      ## project/plans/2026-10-07-sdk-operator-semantics.md (section 4),
      ## as decided on qfg-goi1.5 (2026-10-09, 2026-10-12):
      ##  R1 canonical string form for *_ONE_OF and string ops: bool ->
      ##     "true"/"false"; an integral number -> plain digits (no ".0",
      ##     no exponent) whatever its runtime type; case-sensitive.
      ##  R2 string operators stringify non-string context values (R1).
      ##  R3 IN_INT_RANGE is [start, end); a missing bound is unbounded.
      ##  R4 semver = SemVer 2.0 precedence (prerelease < release, build
      ##     metadata ignored); abbreviated "2" / "2.0" = 2.0.0 (Q5);
      ##     a "v" prefix is invalid.
      ##  R5 a timestamp is a JSON number (epoch ms), an all-digit string
      ##     (epoch ms), or RFC3339 with Z or a numeric offset, on BOTH the
      ##     context and the criterion side. Date-only, offset-less and
      ##     free-form strings never match.
      ##  R6 numeric operators need a numeric context value.
      ## Whole-number floats (1.0, 1234567.0) cannot be carried by a YAML
      ## corpus case (generators read YAML as JS numbers); SDKs cover them
      ## with unit tests (plan section 6, SIMPLIFY row).
      ##################################################################

