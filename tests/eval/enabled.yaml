---
function: enabled
tests:
  - cases:

      ################
      ## ALWAYS_ON ##
      ################

      - name: returns the correct value for a simple flag
        client: feature_flag_client
        function: enabled
        input:
          flag: "feature-flag.simple"
        expected:
          value: true

      - name: always returns false for a non-boolean flag
        client: feature_flag_client
        function: enabled
        input:
          flag: "feature-flag.integer"
        expected:
          value: false


      #################
      ## MISSING KEY ##
      #################
      ## enabled() on a key that does not exist returns false -- it never
      ## raises, regardless of the client's on_no_default (qfg-goi1.3).

      - name: returns false for a flag key that does not exist
        client: feature_flag_client
        function: enabled
        input:
          flag: "my-missing-key"
        expected:
          value: false

      - name: returns false for a flag key that does not exist with a context
        client: feature_flag_client
        function: enabled
        contexts:
          local:
            user:
              key: "michael"
              email: "michael@example.com"
        input:
          flag: "my-missing-key"
        expected:
          value: false


      #####################
      ## PROP_IS_ONE_OF ##
      #####################

      - name: returns true for a PROP_IS_ONE_OF rule when any prop matches
        client: feature_flag_client
        function: enabled
        contexts:
          local:
            "":
              name: "michael"
              domain: "something.com"
        input:
          flag: "feature-flag.properties.positive"
        expected:
          value: true

      - name: returns false for a PROP_IS_ONE_OF rule when no prop matches
        client: feature_flag_client
        function: enabled
        contexts:
          local:
            "":
              name: "lauren"
              domain: "something.com"
        input:
          flag: "feature-flag.properties.positive"
        expected:
          value: false

