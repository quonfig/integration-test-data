function: sse_resilience
tests:
  - name: "03 latency — 5000ms on SSE port"
    description: |
      Slow but not stalled. Heartbeats still arrive, just delayed. Layer 1 must
      NOT trip — 5s latency is well inside the 90s read deadline. No fallback engaged.
    setup:
      sdk: any
      sse_endpoint: chaos
      http_endpoint: chaos
      wall_clock_seconds: 60
    chaos:
      - at_ms: 5000
        inject:
          name: latency_5s
          sse_latency_ms: 5000
    expectations:
      - within_ms: 10000
        assert: "client.connectionState() == 'connected'"
      - within_ms: 60000
        must_hold_for_ms: 30000
        assert: "client.connectionState() == 'connected' AND client.fallbackPollerActive() == false"
      - within_ms: 60000
        assert: "client.sdkMetric('quonfig_sdk_worker_restart_total', layer='1') == 0"
