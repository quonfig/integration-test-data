function: sse_resilience
tests:
  - name: "05 SSE down for 180s — Layer 2 fallback engages and recovers"
    description: |
      Hard SSE outage with HTTP still healthy. After 120s of disconnect Layer 2
      fallback polling MUST engage (default 60s). When SSE returns, Layer 2 MUST
      shut down again.
    setup:
      sdk: any
      sse_endpoint: chaos
      http_endpoint: direct
      wall_clock_seconds: 260
    chaos:
      - at_ms: 5000
        inject:
          name: sse_dead
          sse_down_ms: 180000
      - at_ms: 185000
        clear: sse_dead
    expectations:
      - within_ms: 5000
        assert: "client.connectionState() == 'connected'"
      - within_ms: 135000
        assert: "client.connectionState() == 'falling_back' AND client.fallbackPollerActive() == true"
      # Recency + continuous-hold. Once Layer 2 fallback engages, EVERY poll must
      # advance lastSuccessfulRefresh — including the polls answered 304 Not
      # Modified or dropped by the reject-older guard, which are successful
      # refreshes that install nothing (qfg-41nh.11). must_hold_for_ms forces the
      # stamp to stay fresh continuously across a full fallback poll cycle, which
      # is only provable now that answered-but-not-installed refreshes stamp:
      # before the fix, node/python froze the stamp on 304 polls and this hold
      # went red. The window stays ABOVE the chaos rig's 60s
      # fallback_poll_interval_ms (test_chaos.py), so it is 70s (poll interval +
      # 10s margin) — a smaller window (e.g. 40s) cannot hold continuously against
      # a 60s poll cadence.
      - within_ms: 200000
        must_hold_for_ms: 60000
        assert: "client.lastSuccessfulRefresh() >= (now() - 70000)"
      - within_ms: 230000
        assert: "client.connectionState() == 'connected' AND client.fallbackPollerActive() == false"
