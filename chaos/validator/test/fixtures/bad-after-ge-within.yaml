function: sse_resilience
tests:
  - name: "bad-after-ge-within"
    setup:
      sdk: any
      sse_endpoint: chaos
      wall_clock_seconds: 120
    chaos:
      - at_ms: 5000
        inject:
          sse_down_ms: 60000
    expectations:
      - within_ms: 5000
        assert: "client.connectionState() == 'connected'"
      - within_ms: 90000
        after_ms: 90000
        assert: "client.connectionState() == 'connected'"
